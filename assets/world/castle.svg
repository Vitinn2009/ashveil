    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a1c"/>
      <stop offset="1" stop-color="#1c120a"/>
    </linearGradient>
  </defs>
  <ellipse cx="450" cy="500" rx="400" ry="18" fill="#000" opacity="0.3"/>
  <!-- Muralha -->
  <rect x="40" y="320" width="820" height="170" fill="url(#stoneDark)"/>
  <g fill="url(#stoneDark)">
