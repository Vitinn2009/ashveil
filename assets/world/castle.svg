  <line x1="450" y1="20" x2="450" y2="-8" stroke="#3a2a1c" stroke-width="4"/>
  <path d="M450 -6 L492 4 L450 14 Z" fill="#f2b705" stroke="#8a6a08" stroke-width="2"/>
