  <rect x="330" y="150" width="240" height="340" fill="url(#stone)"/>
  <g fill="url(#stone)">
    <rect x="330" y="124" width="36" height="32"/><rect x="384" y="124" width="36" height="32"/><rect x="438" y="124" width="36" height="32"/>
    <rect x="492" y="124" width="36" height="32"/><rect x="534" y="124" width="36" height="32"/>
