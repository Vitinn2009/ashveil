    <rect x="190" y="298" width="30" height="26"/><rect x="240" y="298" width="30" height="26"/>
    <rect x="630" y="298" width="30" height="26"/><rect x="680" y="298" width="30" height="26"/><rect x="730" y="298" width="30" height="26"/>
    <rect x="780" y="298" width="30" height="26"/><rect x="830" y="298" width="30" height="26"/>
